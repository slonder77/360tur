<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marzipano 360 Kokpit Örneği</title>
    <style>
        html, body, #pano {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .group-header {
            font-size: 13px;
            font-weight: bold;
            color: #ff8c00;
            background: #f8f9fa;
            padding: 8px 10px;
            margin: 10px 0 5px 0;
            border-left: 4px solid #ff8c00;
            border-radius: 4px;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
        }
        
        .group-header:first-child {
            margin-top: 0;
        }

        /* --- AKILLİ VE ŞEFFAF TURUNCU HOTSPOT STİLLERİ --- */
        .custom-hotspot {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 100;
            transition: opacity 0.3s ease;
        }

        .hotspot-dot {
            width: 18px;
            height: 18px;
            background: rgba(255, 140, 0, 0.6);
            border: 2px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .custom-hotspot:hover .hotspot-dot {
            width: 150px;
            height: 38px;
            border-radius: 19px;
            background: rgba(255, 140, 0, 0.85);
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.8);
        }

        .hotspot-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .custom-hotspot:hover .hotspot-text {
            opacity: 1;
        }

        /* --- BUTONUN YANINDA AÇILAN POPUP MENÜ --- */
        .hotspot-popup {
            position: fixed;
            width: 440px;
            max-height: 80vh;
            overflow-y: auto;
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 999999;
            cursor: default;
            box-sizing: border-box;
        }

        .popup-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
        }

        .popup-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .item-number {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            min-width: 15px;
            text-align: center;
        }

        .popup-item img {
            width: 90px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .popup-item img:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .item-text {
            flex-grow: 1;
        }

        .item-text h4 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: #0066cc;
            font-family: Arial, sans-serif;
            cursor: pointer;
            text-decoration: underline;
        }

        .item-text h4:hover {
            color: #004499;
        }

        .item-text p {
            margin: 0;
            font-size: 11px;
            color: #555;
            font-family: Arial, sans-serif;
            line-height: 1.3;
        }

        #controlPanel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            padding: 15px;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(5px);
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .control-group span {
            font-weight: bold;
            color: #ff8c00;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #ff8c00;
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        #axisOverlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 998;
            transition: opacity 0.3s ease;
        }
        #axisOverlay::before {
            content: '';
            position: absolute;
            top: 19px; left: 0; width: 40px; height: 2px;
            background: rgba(255, 0, 0, 0.7);
        }
        #axisOverlay::after {
            content: '';
            position: absolute;
            top: 0; left: 19px; width: 2px; height: 40px;
            background: rgba(0, 255, 0, 0.7);
        }

        /* --- ANA METİN MODALI --- */
        #textModal {
            display: none;
            position: fixed;
            z-index: 9999999;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .text-modal-content {
            background: #ffffff; 
            width: min-content;
            min-width: 300px;
            max-width: 95vw;
            max-height: 92vh;
            overflow: auto;
            padding: 24px;
            border-radius: 12px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: fixed; 
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: Arial, sans-serif; 
            cursor: default;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        .text-modal-content h3 { 
            margin-top: 0; 
            color: #222; 
            cursor: move;
            user-select: none; 
            padding-right: 60px;
        }
        .text-modal-content p { 
            color: #555; 
            font-size: 14px; 
            line-height: 1.5; 
            margin: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .modal-media-wrapper {
            position: relative;
            display: inline-block;
            align-self: center;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-inner-img {
            width: auto;
            height: auto;
            max-width: 85vw;
            max-height: 70vh;
            display: block;
            object-fit: contain;
        }

        .close-btn {
            position: absolute; top: 15px; right: 20px;
            font-size: 24px; cursor: pointer; color: #888;
            z-index: 10;
        }
        .close-btn:hover { color: #000; }

        .back-btn {
            position: absolute; 
            top: 15px; 
            right: 55px;
            background: #f0f0f0;
            border: 1px solid #ccc;
            color: #333;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
            display: none;
        }
        .back-btn:hover { background: #e0e0e0; }

        #thumbnailBar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            z-index: 9999;
            backdrop-filter: blur(5px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .thumb-item {
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }

        .thumb-item:hover {
            transform: scale(1.05);
        }

        .thumb-item img {
            width: 70px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid #555;
            display: block;
        }

        .thumb-item:hover img {
            border-color: #ff8c00;
        }

        .thumb-item span {
            color: #fff;
            font-size: 11px;
            font-family: Arial, sans-serif;
            margin-top: 4px;
            display: block;
        }

        #sidebarMenu {
            position: fixed;
            top: 20px;
            left: -260px;
            width: 260px;
            height: calc(100vh - 40px);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 0 12px 12px 0;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 9999;
            transition: left 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        #sidebarMenu:hover, #sidebarMenu.open {
            left: 0;
        }

        #sidebarMenu::after {
            content: '⚙️ Menü';
            position: absolute;
            right: -55px;
            top: 20px;
            background: rgba(20, 20, 20, 0.9);
            color: #ff8c00;
            padding: 10px 12px;
            border-radius: 0 8px 8px 0;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 4px 0 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="pano"></div>

    <div id="axisOverlay"></div>

    <div id="controlPanel">
        <div><b>Koordinat Bilgisi</b></div>
        <div>Yaw: <span id="yawVal">0.00</span></div>
        <div>Pitch: <span id="pitchVal">0.00</span></div>
        <hr style="border:0; border-top:1px solid #444; margin:2px 0;">
        <div class="control-group">
            <span>Eksenleri Gizle</span>
            <label class="switch">
                <input type="checkbox" id="toggleAxis">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-group">
            <span>Hotspot'ları Gizle</span>
            <label class="switch">
                <input type="checkbox" id="toggleHotspots">
                <span class="slider"></span>
            </label>
        </div>
        <button onclick="yenileNW()" style="background:#ff8c00; color:#fff; border:none; padding:7px; border-radius:6px; font-weight:bold; cursor:pointer; width:100%; margin-top:4px;">🔄 Yenile</button>
    </div>
    


    <!-- Metin ve Resim Modali -->
    <div id="textModal">
        <div class="text-modal-content" id="textModalContent" onclick="event.stopPropagation()">
            <button class="back-btn" id="modalBackBtn">⬅ Back </button>
            <span class="close-btn" id="closeTextModal">&times;</span>
            <h3 id="textModalTitle">Detay Başlığı</h3>
            <p id="textModalDesc">Açıklama</p>
        </div>
    </div>

    <!-- Alt Thumbnail Çubuğu -->
    <div id="thumbnailBar">
        <div class="thumb-item" onclick="switchToScene('main')">
            <img src="resimler/kokpit.png" alt="Ana Kokpit">
            <span>Ana Kokpit</span>
        </div>
        <div class="thumb-item" onclick="switchToScene('overhead')">
            <img src="resimler/p_gen_control.jpg" alt="Tavan Paneli">
            <span>Tavan Paneli</span>
        </div>
    </div>

    <!-- Sol Açılır Sistem Menüsü -->
    <div id="sidebarMenu">
        <div class="sidebar-header">
            <h3>Kokpit Sistemleri</h3>
            <input type="text" id="searchInput" placeholder="Parça veya Sistem Ara..." onkeyup="filterSystems()">
        </div>
        <div class="sidebar-content" id="sidebarList">
            <div class="system-category" onclick="switchToScene('main')">
                <span>✈️ Ana Kokpit Paneli</span>
            </div>
            <div class="system-category" onclick="switchToScene('overhead')">
                <span>⚡ Tavan (Overhead) Paneli</span>
            </div>
        </div>
    </div>

    <script src="marzipano.js"></script>
    <script src="max13app.js"></script>

    <script>
        var textModalContent = document.getElementById('textModalContent');
        var isDragging = false;
        var startX, startY, initialX, initialY;

        textModalContent.addEventListener('mousedown', function(e) {
            if (e.target.id === 'closeTextModal' || e.target.id === 'modalBackBtn' || e.target.tagName === 'BUTTON') return;
            
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;

            var rect = textModalContent.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;

            textModalContent.style.transform = 'none';
            textModalContent.style.left = initialX + 'px';
            textModalContent.style.top = initialY + 'px';
            
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
            if (!isDragging) return;
            var dx = e.clientX - startX;
            var dy = e.clientY - startY;
            textModalContent.style.left = (initialX + dx) + 'px';
            textModalContent.style.top = (initialY + dy) + 'px';
        }

        function onMouseUp() {
            isDragging = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }
        function yenileNW() {
            if (typeof nw !== 'undefined' && nw.Window) {
                nw.Window.get().reloadIgnoringCache();
            } else {
                location.reload();
            }
        }
        // --- IPAD / DOKUNMATİK SÜRÜKLEME DESTEĞİ ---
        textModalContent.addEventListener('touchstart', function(e) {
            if (e.target.id === 'closeTextModal' || e.target.id === 'modalBackBtn' || e.target.tagName === 'BUTTON') return;
            if (e.touches.length !== 1) return;

            isDragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;

            var rect = textModalContent.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;

            textModalContent.style.transform = 'none';
            textModalContent.style.left = initialX + 'px';
            textModalContent.style.top = initialY + 'px';
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
            if (!isDragging || e.touches.length !== 1) return;
            var dx = e.touches[0].clientX - startX;
            var dy = e.touches[0].clientY - startY;
            textModalContent.style.left = (initialX + dx) + 'px';
            textModalContent.style.top = (initialY + dy) + 'px';
        }, { passive: true });

        document.addEventListener('touchend', function() {
            isDragging = false;
        });

        // --- IPAD İÇİN SOL MENÜ AÇ/KAPA DESTEĞİ ---
        var sidebarMenu = document.getElementById('sidebarMenu');
        sidebarMenu.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT') return; // Arama kutusuna dokununca menüyü kapatma
            e.stopPropagation();
            sidebarMenu.classList.toggle('open');
        });
        document.addEventListener('click', function() {
            sidebarMenu.classList.remove('open');
        });
    </script>
</body>
</html>
